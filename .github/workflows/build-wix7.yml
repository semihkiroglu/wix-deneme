name: Jenkins WiX Windows Docker smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 330
    steps:
      - name: Checkout Jenkins and Docker recipe
        uses: actions/checkout@v4
      - name: Select Jenkins Java runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Windows Docker host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          docker version
          if ($LASTEXITCODE -ne 0) { throw 'Docker engine unavailable' }
          $info = docker info --format '{{json .}}' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $info.OSType -ne 'windows') { throw 'Windows Docker engine required' }
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,BuildNumber
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free
      - name: Run helper regressions including host PowerShell 5.1
        shell: pwsh
        run: |
          ./tests/Build-Wix.Tests.ps1
          ./tests/VswhereBootstrap.Tests.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File ./tests/Publish-Wix.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Publisher regressions failed under Windows PowerShell 5.1' }
      - name: Run real Jenkins pipeline and download its archived output
        shell: pwsh
        run: ./tests/JenkinsSmoke.ps1
      - name: Upload Jenkins artifacts and console
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-wix7-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/jenkins-evidence/
          if-no-files-found: error
          retention-days: 7
