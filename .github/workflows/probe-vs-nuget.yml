# One-off probe: does the pinned VS Build Tools payload ship nuget.exe?
# Phase 1 installs the exact component set Install-BuildEnv.ps1 uses; Phase 2 adds the
# NuGet components explicitly and re-searches. Delete this workflow after the answer is recorded.
name: Probe VS BuildTools nuget.exe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Install VS BuildTools (exact production variant)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -sSL -o vs_BuildTools.exe "https://download.visualstudio.microsoft.com/download/pr/83ec5fa2-d38d-43d5-9f58-31ea8e1c66e4/62d8e57ac5ccd56eabd627c9de2cafe4dc463f9db520a72673ed08b1e83c48b7/vs_BuildTools.exe"
          $sha = (Get-FileHash vs_BuildTools.exe -Algorithm SHA256).Hash.ToLower()
          "bootstrapper sha256: $sha"
          $args = @('--quiet','--wait','--norestart','--nocache','--installPath','C:\BuildTools',
            '--add','Microsoft.VisualStudio.Workload.VCTools',
            '--add','Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64',
            '--add','Microsoft.VisualStudio.Workload.ManagedDesktopBuildTools',
            '--add','Microsoft.VisualStudio.Component.TestTools.BuildTools',
            '--add','Microsoft.VisualStudio.Component.VC.ATL',
            '--includeRecommended')
          $p = Start-Process -FilePath .\vs_BuildTools.exe -ArgumentList $args -Wait -PassThru
          "installer exit: $($p.ExitCode)"
          if ($p.ExitCode -notin @(0,3010)) { throw "VS install failed: $($p.ExitCode)" }
          $vsInstalled = @(& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -products * -property installationVersion | Where-Object { $_ -like '17.14*' })
          "installed build: $($vsInstalled -join ', ')"

      - name: Phase 1 - search nuget.exe with the production component set
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem -Path 'C:\BuildTools' -Recurse -Filter 'nuget*.exe' -ErrorAction SilentlyContinue)
          "PHASE1 exe count: $($exe.Count)"
          $exe | ForEach-Object { "PHASE1 FOUND: $($_.FullName) :: $($_.VersionInfo.ProductVersion)" }
          "PHASE1 standard path exists: $(Test-Path 'C:\BuildTools\Common7\IDE\CommonExtensions\Microsoft\NuGet\NuGet.exe')"
          "PHASE1 CommonExtensions\Microsoft\NuGet dir:"
          Get-ChildItem 'C:\BuildTools\Common7\IDE\CommonExtensions\Microsoft\NuGet' -ErrorAction SilentlyContinue | ForEach-Object { "  $($_.Name)" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          "PHASE1 has NuGet.BuildTools component: $(@(& $vswhere -products * -requires Microsoft.VisualStudio.Component.NuGet.BuildTools -property installationPath).Count -eq 1)"

      - name: Phase 2 - add NuGet components explicitly and re-search
        shell: pwsh
        run: |
          $args = @('--quiet','--wait','--norestart','--nocache','--installPath','C:\BuildTools',
            '--add','Microsoft.VisualStudio.Component.NuGet.BuildTools',
            '--add','Microsoft.VisualStudio.Component.NuGet')
          $p = Start-Process -FilePath .\vs_BuildTools.exe -ArgumentList $args -Wait -PassThru
          "modify exit: $($p.ExitCode)"
          $exe = @(Get-ChildItem -Path 'C:\BuildTools' -Recurse -Filter 'nuget*.exe' -ErrorAction SilentlyContinue)
          "PHASE2 exe count: $($exe.Count)"
          $exe | ForEach-Object { "PHASE2 FOUND: $($_.FullName) :: $($_.VersionInfo.ProductVersion)" }
          "PHASE2 standard path exists: $(Test-Path 'C:\BuildTools\Common7\IDE\CommonExtensions\Microsoft\NuGet\NuGet.exe')"
          $dll = @(Get-ChildItem -Path 'C:\BuildTools\Common7\IDE\CommonExtensions\Microsoft\NuGet' -Filter '*.dll' -ErrorAction SilentlyContinue)
          "PHASE2 nuget dll count in CommonExtensions: $($dll.Count)"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          "PHASE2 has NuGet.BuildTools component: $(@(& $vswhere -products * -requires Microsoft.VisualStudio.Component.NuGet.BuildTools -property installationPath).Count -eq 1)"
          "PHASE2 has NuGet component: $(@(& $vswhere -products * -requires Microsoft.VisualStudio.Component.NuGet -property installationPath).Count -eq 1)"
