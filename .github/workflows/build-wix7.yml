name: Jenkins WiX Windows Docker smoke

on:
  workflow_dispatch:
    inputs:
      test_only:
        description: Run helper regressions without the long Jenkins Docker build
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Checkout Jenkins and Docker recipe
        uses: actions/checkout@v4
      - name: Select Jenkins Java runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare disposable Windows Docker storage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:GITHUB_ACTIONS -ne 'true') { throw 'Storage relocation is restricted to github-hosted runners' }
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='D:'"
          if ($disk.FreeSpace -lt 60GB) { throw 'D: needs at least 60 GiB free space for the Windows build' }
          $containers = @(docker ps -aq)
          if ($LASTEXITCODE -ne 0 -or $containers.Count) { throw 'Refusing to restart Docker with existing containers' }
          $path = Join-Path $env:ProgramData 'Docker/config/daemon.json'
          New-Item -ItemType Directory -Force (Split-Path $path) | Out-Null
          $config = if (Test-Path $path) { Get-Content $path -Raw | ConvertFrom-Json -AsHashtable } else { @{} }
          $config['data-root'] = 'D:\wix-docker'
          $candidate = "$path.wix"
          $config | ConvertTo-Json -Depth 10 | Set-Content $candidate -Encoding utf8NoBOM
          dockerd --validate --config-file $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Docker configuration validation failed' }
          Copy-Item $candidate $path -Force
          Restart-Service docker
          (Get-Service docker).WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          $root = docker info --format '{{.DockerRootDir}}'
          if ($LASTEXITCODE -ne 0 -or $root -ne 'D:\wix-docker') { throw "Docker did not apply the D: storage root: $root" }
          Write-Host "DOCKER_STORAGE_READY: $root"
      - name: Check Windows Docker host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          docker version
          if ($LASTEXITCODE -ne 0) { throw 'Docker engine unavailable' }
          $info = docker info --format '{{json .}}' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $info.OSType -ne 'windows') { throw 'Windows Docker engine required' }
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,BuildNumber
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free
      - name: Probe MSI database creation at long paths inside the container
        if: ${{ inputs.test_only }}
        shell: pwsh
        run: ./tests/MsiLongPathProbe.ps1
      - name: Probe container services required by the upstream MsiE2E tests
        if: ${{ inputs.test_only }}
        shell: pwsh
        run: ./tests/MsiLongPathProbe.ps1 -ContainerScript ContainerServicesProbeContainer.ps1
      - name: Probe upstream native process capture with real and wrapped vswhere
        shell: pwsh
        run: ./tests/NativeCaptureProbe.ps1
      - name: Upload native capture diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-capture-${{ github.run_id }}
          path: ${{ runner.temp }}/wix-native-capture-probe/
          if-no-files-found: warn
          retention-days: 7
      - name: Run helper regressions including host PowerShell 5.1
        shell: pwsh
        run: |
          ./tests/Build-Wix.Tests.ps1
          ./tests/Storage.Tests.ps1
          ./tests/VswhereBootstrap.Tests.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File ./tests/Publish-Wix.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Publisher regressions failed under Windows PowerShell 5.1' }
      - name: Run real Jenkins pipeline and download its archived output
        if: ${{ !inputs.test_only }}
        shell: pwsh
        run: ./tests/JenkinsSmoke.ps1
      - name: Upload Jenkins artifacts and console
        if: ${{ always() && !inputs.test_only }}
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-wix7-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/jenkins-evidence/
            ${{ runner.temp }}/wix-jenkins-home/workspace/wix-docker/artifacts/v7.0.0/logs/
          if-no-files-found: error
          retention-days: 7
