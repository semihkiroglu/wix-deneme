name: Build WiX 6.0.0.1 (CTech Stable)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wix6-600.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 330
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
      NUGET_XMLDOC_MODE: skip
      CheckEolTargetFramework: "false"
      RuntimeTestsEnabled: "true"
      WixOfficialBuild: "false"
      SignBuild: "false"

    steps:
      - name: Checkout WiX 6.0.0 source
        uses: actions/checkout@v4
        with:
          repository: wixtoolset/wix
          ref: v6.0.0
          fetch-depth: 0
          path: wix-source

      - name: Verify exact upstream revision
        shell: pwsh
        working-directory: wix-source
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          Write-Host "Source SHA: $sha"
          if ($sha -ne '8c7432e50072e009353ea5f2c956ccf453476f71') {
            throw "Unexpected WiX 6.0.0 source SHA: $sha"
          }
          if ((git describe --tags --exact-match).Trim() -ne 'v6.0.0') {
            throw "Unexpected source tag"
          }

      - name: Install exact historical .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.407
            6.0.428

      - name: Clean preinstalled Visual Studio 2022 products
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cleanup = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\InstallCleanup.exe'
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $cleanup)) { throw "InstallCleanup.exe not found: $cleanup" }
          if (-not (Test-Path $vswhere)) { throw "vswhere not found: $vswhere" }

          Write-Host 'Visual Studio 2022 instances before cleanup:'
          & $vswhere -all -products * -version '[17.0,18.0)' -property installationPath

          # Microsoft documents -i 17 for removing all Visual Studio 17.x
          # product information and main installation directories when a normal
          # uninstall has failed and the same major version will be reinstalled.
          $process = Start-Process -FilePath $cleanup -ArgumentList @('-i','17') -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "InstallCleanup.exe failed with exit code $($process.ExitCode)"
          }

          $remaining = @(& $vswhere -all -products * -version '[17.0,18.0)' -property installationPath | Where-Object { $_ })
          if ($remaining.Count) {
            throw "Visual Studio 2022 product(s) remain after InstallCleanup: $($remaining -join ', ')"
          }
          Write-Host 'Visual Studio 2022 product registrations cleared on disposable runner.'

      - name: Install Visual Studio 2022 Build Tools 17.13.5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targetVersion = '17.13.5'
          $targetBuild = '17.13.35919.96'
          $installPath = 'C:\CTech\VS2022BuildTools-17.13.5'
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'vs_buildtools_17.13.5.exe'

          # Resolve Microsoft's fixed-version Build Tools bootstrapper from the
          # official Visual Studio 2022 release-history row for 17.13.5.
          $historyUri = 'https://learn.microsoft.com/en-us/visualstudio/releases/2022/release-history'
          $html = (Invoke-WebRequest -Uri $historyUri -UseBasicParsing).Content
          $versionIndex = $html.IndexOf($targetVersion, [System.StringComparison]::Ordinal)
          if ($versionIndex -lt 0) { throw "Visual Studio $targetVersion row not found in Microsoft release history" }
          $rowStart = $html.LastIndexOf('<tr', $versionIndex, [System.StringComparison]::OrdinalIgnoreCase)
          $rowEnd = $html.IndexOf('</tr>', $versionIndex, [System.StringComparison]::OrdinalIgnoreCase)
          if ($rowStart -lt 0 -or $rowEnd -lt 0) { throw "Could not isolate Visual Studio $targetVersion release-history row" }
          $rowHtml = $html.Substring($rowStart, ($rowEnd + 5) - $rowStart)
          $link = [regex]::Match($rowHtml, '(?is)<a\b[^>]*href=["''](?<url>[^"'']+)["''][^>]*>\s*Build Tools\s*</a>')
          if (-not $link.Success) { throw "Build Tools bootstrapper link not found for Visual Studio $targetVersion" }
          $bootstrapperUri = [System.Net.WebUtility]::HtmlDecode($link.Groups['url'].Value)
          if ($bootstrapperUri -notmatch '^https://download[.]visualstudio[.]microsoft[.]com/') {
            throw "Unexpected Build Tools bootstrapper host: $bootstrapperUri"
          }

          Invoke-WebRequest -Uri $bootstrapperUri -OutFile $bootstrapper
          $bootstrapperVersion = (Get-Item $bootstrapper).VersionInfo.ProductVersion
          Write-Host "Fixed-version bootstrapper: $bootstrapperVersion"
          if ($bootstrapperVersion -notmatch '^17[.]13[.]5(?:[+.]|$)') {
            throw "Unexpected Build Tools bootstrapper version: $bootstrapperVersion"
          }

          $arguments = @(
            '--quiet',
            '--wait',
            '--norestart',
            '--nocache',
            '--installPath', $installPath,
            '--add', 'Microsoft.VisualStudio.Workload.VCTools',
            '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
            '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64',
            '--add', 'Microsoft.VisualStudio.Workload.ManagedDesktopBuildTools',
            '--includeRecommended'
          )
          $process = Start-Process -FilePath $bootstrapper -ArgumentList $arguments -Wait -PassThru
          Write-Host "Build Tools bootstrapper exit code: $($process.ExitCode)"

          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere missing after bootstrapper: $vswhere" }

          Write-Host 'All Visual Studio instances after bootstrapper:'
          & $vswhere -all -products * -format json

          $vsCandidates = @(& $vswhere -products Microsoft.VisualStudio.Product.BuildTools -version '[17.13,17.14)' -property installationPath | Where-Object { $_ })
          $buildCandidates = @(& $vswhere -products Microsoft.VisualStudio.Product.BuildTools -version '[17.13,17.14)' -property installationVersion | Where-Object { $_ })

          if ($process.ExitCode -notin @(0, 3010) -or -not $vsCandidates.Count) {
            Write-Host 'Historical Build Tools instance was not registered. Dumping Visual Studio installer diagnostics.'
            Write-Host "Requested install path exists: $(Test-Path $installPath)"
            if (Test-Path $installPath) {
              Get-ChildItem $installPath -Force -ErrorAction SilentlyContinue | Select-Object -First 50 FullName
            }

            $patterns = @('dd_bootstrapper*.log','dd_client*.log','dd_setup*.log')
            foreach ($pattern in $patterns) {
              $logs = @(Get-ChildItem $env:TEMP -Filter $pattern -File -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 3)
              foreach ($log in $logs) {
                Write-Host "===== $($log.FullName) ====="
                Get-Content $log.FullName -Tail 300 -ErrorAction SilentlyContinue
              }
            }

            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Visual Studio Build Tools installation failed with exit code $($process.ExitCode)"
            }
            throw 'Visual Studio 2022 Build Tools 17.13 installation was not registered'
          }

          $vs = $vsCandidates[0]
          $installedBuild = if ($buildCandidates.Count) { $buildCandidates[0] } else { $null }
          Write-Host "Historical Build Tools installation: $vs"
          Write-Host "Historical Build Tools build: $installedBuild"
          if ($installedBuild -ne $targetBuild) {
            throw "Expected Visual Studio build $targetBuild but found $installedBuild"
          }

          $devCmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\amd64\MSBuild.exe'
          if (-not (Test-Path $devCmd)) { throw "VsDevCmd not found: $devCmd" }
          if (-not (Test-Path $msbuild)) { throw "MSBuild not found: $msbuild" }

          $vcToolsRoot = Join-Path $vs 'VC\Tools\MSVC'
          $vcToolsets = @(Get-ChildItem $vcToolsRoot -Directory -ErrorAction SilentlyContinue | Sort-Object Name)
          if (-not $vcToolsets.Count) {
            throw "MSVC v143 toolset was not installed under $vcToolsRoot"
          }
          Write-Host "Installed MSVC toolsets: $($vcToolsets.Name -join ', ')"

          # SfxCA builds x86, x64 and ARM64; a toolset folder alone is insufficient.
          foreach ($arch in @('x86', 'x64', 'arm64')) {
            $compilers = @($vcToolsets | ForEach-Object {
              Join-Path $_.FullName "bin\Hostx64\$arch\cl.exe"
            } | Where-Object { Test-Path $_ })
            if (-not $compilers.Count) {
              throw "MSVC v143 compiler missing for $arch under $vcToolsRoot"
            }
            Write-Host "Verified $arch compiler: $($compilers -join ', ')"
          }

          "CTECH_VSROOT=$vs" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CTECH_VSDEVCMD=$devCmd" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CTECH_MSBUILD=$msbuild" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Report installed toolchains
        shell: pwsh
        run: |
          dotnet --list-sdks
          dotnet --list-runtimes
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -products Microsoft.VisualStudio.Product.BuildTools -version '[17.13,17.14)' -property installationVersion
          & "$env:CTECH_MSBUILD" -version

      - name: Install x86 .NET 6 runtime for Burn integration helper executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          $installScript = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'

          # Burn integration fixtures invoke win-x86 .NET 6 apphosts.
          # The GitHub runner supplies an x64 DOTNET_ROOT, which causes the
          # x86 apphost to load an incompatible hostfxr.dll (0x800700C1).
          Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile $installScript
          # dotnet-install.ps1 is a PowerShell script; $LASTEXITCODE may be stale
          # from a previous native command. Validate the installed files below.
          & $installScript -Channel '6.0' -Runtime dotnet -Architecture x86 -InstallDir $installDir -NoPath

          $hostfxr = @(Get-ChildItem (Join-Path $installDir 'host\fxr') -Directory |
            Where-Object { $_.Name -match '^6[.]0[.]' })
          $runtime = @(Get-ChildItem (Join-Path $installDir 'shared\Microsoft.NETCore.App') -Directory |
            Where-Object { $_.Name -match '^6[.]0[.]' })
          if (-not $hostfxr.Count -or -not $runtime.Count) {
            throw 'Required x86 .NET 6 hostfxr and Microsoft.NETCore.App runtime were not installed'
          }
          & (Join-Path $installDir 'dotnet.exe') --list-runtimes
          if ($LASTEXITCODE -ne 0) { throw 'x86 dotnet.exe runtime self-check failed' }

          # Architecture-specific variables take precedence over DOTNET_ROOT.
          "DOTNET_ROOT_X86=$installDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $x64Root = Join-Path $env:ProgramFiles 'dotnet'
          "DOTNET_ROOT_X64=$x64Root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "x86 .NET 6 runtime ready: $installDir"
          Write-Host "x64 .NET runtime remains unchanged: $x64Root"

      - name: Pin .NET SDK visibility to the historical toolchain (no source edits)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = Join-Path $env:ProgramFiles 'dotnet\sdk'
          $requiredSdks = @('8.0.407', '6.0.428')
          foreach ($required in $requiredSdks) {
            if (-not (Test-Path (Join-Path $sdkRoot $required))) {
              throw "Required historical .NET SDK not installed: $required"
            }
          }

          # WiX 6 upstream-generated global.json has no pinned SDK version.
          # Keep only the SDKs from the selected historical toolchain visible
          # to the resolver on this disposable runner.
          $disabledRoot = Join-Path $env:RUNNER_TEMP 'dotnet-sdk-ctech-disabled'
          New-Item -ItemType Directory -Path $disabledRoot -Force | Out-Null
          Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -notin $requiredSdks } |
            ForEach-Object {
              $destination = Join-Path $disabledRoot $_.Name
              Write-Host "Temporarily hiding non-historical SDK: $($_.Name)"
              Move-Item -LiteralPath $_.FullName -Destination $destination -ErrorAction Stop
            }

          Write-Host 'SDKs available to MSBuild:'
          dotnet --list-sdks
          $selectedSdk = (dotnet --version).Trim()
          Write-Host "Selected .NET SDK: $selectedSdk"
          if ($selectedSdk -ne '8.0.407') {
            throw "Expected .NET SDK 8.0.407 but dotnet selected $selectedSdk"
          }

          $msbuild = $env:CTECH_MSBUILD
          $devCmd = $env:CTECH_VSDEVCMD
          if (-not $msbuild -or -not (Test-Path $msbuild)) { throw "Pinned MSBuild not found: $msbuild" }
          if (-not $devCmd -or -not (Test-Path $devCmd)) { throw "Pinned VsDevCmd not found: $devCmd" }
          Write-Host 'Pinned historical MSBuild:'
          & $msbuild -version -nologo
          if ($LASTEXITCODE -ne 0) { throw 'Pinned historical MSBuild self-check failed' }

          # Ignore vulnerability audits for this historical source compilation,
          # using the pinned historical MSBuild response file.
          $rsp = Join-Path (Split-Path $msbuild -Parent) 'MSBuild.rsp'
          # -warnNotAsError alone causes MSB1062 on MSBuild commands without -warnAsError.
          # -warnAsMessage works independently, including when upstream invokes -warnaserror.
          # These settings belong to the disposable runner, not any upstream source file.
          $msbuildOptions = @(
            '-p:NuGetAudit=false'
            '-p:CheckEolTargetFramework=false'
            '-warnAsMessage:NU1901,NU1902,NU1903,NU1904,NETSDK1138'
          )
          [System.IO.File]::AppendAllText($rsp, [Environment]::NewLine + ($msbuildOptions -join [Environment]::NewLine) + [Environment]::NewLine)
          Write-Host "Configured MSBuild response file options: $($msbuildOptions -join ' ')"
          Write-Host 'Only runner environment modified; no WiX source edits.'

      - name: Prepare CTech package version before build
        shell: pwsh
        working-directory: wix-source
        run: |
          $ErrorActionPreference = 'Stop'
          $templates = @(
            @{ Path = 'src/internal/SetBuildNumber/SomeVerInfo.props.pp'; Find = '<PackageVersion>{major}.{minor}.{patch}{dashlabel}</PackageVersion>'; Replace = '<PackageVersion>{major}.{minor}.{patch}.1</PackageVersion>' },
            @{ Path = 'src/internal/SetBuildNumber/Directory.Packages.props.pp'; Find = 'Version="{packageversion}"'; Replace = 'Version="{packageversion}.1"' },
            @{ Path = 'src/internal/SetBuildNumber/global.json.pp'; Find = '"WixToolset.Sdk": "{packageversion}"'; Replace = '"WixToolset.Sdk": "{packageversion}.1"' }
          )
          foreach ($entry in $templates) {
            $path = Join-Path $PWD $entry.Path
            $original = [System.IO.File]::ReadAllText($path)
            if (-not $original.Contains($entry.Find)) {
              throw "Expected version template not found: $($entry.Path)"
            }
            $updated = $original.Replace($entry.Find, $entry.Replace)
            [System.IO.File]::WriteAllText($path, $updated)
            Write-Host "Patched: $($entry.Path)"
          }
          git diff --check
          $changed = @((git diff --name-only) | Where-Object { $_ })
          $allowed = @(
            'src/internal/SetBuildNumber/SomeVerInfo.props.pp',
            'src/internal/SetBuildNumber/Directory.Packages.props.pp',
            'src/internal/SetBuildNumber/global.json.pp'
          )
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0 -or $changed.Count -ne 3) {
            throw "Unexpected upstream source modifications: $($changed -join ', ')"
          }
          Write-Host 'Verified: only three versioning templates modified.'
          git diff --stat

      # Follow upstream build_all.cmd in exact order, split at Util extension.
      - name: Build WiX prerequisites and CLI (Release)
        shell: cmd
        working-directory: wix-source
        run: |
          call "%CTECH_VSDEVCMD%" -no_logo -arch=amd64
          if errorlevel 1 exit /b 1
          where msbuild
          msbuild -version
          if errorlevel 1 exit /b 1
          call src\clean.cmd
          if errorlevel 1 exit /b 1
          call src\build_init.cmd
          if errorlevel 1 exit /b 1
          call src\dtf\dtf.cmd release
          if errorlevel 1 exit /b 1
          call src\internal\internal.cmd release
          if errorlevel 1 exit /b 1
          call src\libs\libs.cmd release
          if errorlevel 1 exit /b 1
          call src\api\api.cmd release
          if errorlevel 1 exit /b 1
          call src\burn\burn.cmd release
          if errorlevel 1 exit /b 1
          call src\wix\wix.cmd release
          if errorlevel 1 exit /b 1
          call src\tools\tools.cmd release
          exit /b %errorlevel%

      - name: Build and pack Util extension without invoking tests
        shell: cmd
        working-directory: wix-source
        run: |
          call "%CTECH_VSDEVCMD%" -no_logo -arch=amd64
          if errorlevel 1 exit /b 1
          msbuild "src\ext\Util\wixext\WixToolset.Util.wixext.csproj" -Restore -t:Build -p:Configuration=Release -tl -nologo -m -warnaserror -bl:build\logs\util_prebuild.binlog
          if errorlevel 1 exit /b 1
          msbuild "src\ext\Util\wixext\WixToolset.Util.wixext.csproj" -t:Pack -p:Configuration=Release -p:NoBuild=true -tl -nologo -warnaserror -bl:build\logs\util_prepack.binlog
          if errorlevel 1 exit /b 1
          if not exist "build\artifacts\WixToolset.Util.wixext.6.0.0.1.nupkg" exit /b 1
          exit /b 0

      - name: Populate local WiX extension cache for integration tests
        shell: pwsh
        working-directory: wix-source
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pkg = Join-Path $PWD 'build/artifacts/WixToolset.Util.wixext.6.0.0.1.nupkg'
          if (-not (Test-Path $pkg)) { throw "Util extension package not built: $pkg" }
          $cacheRoot = Join-Path $env:RUNNER_TEMP 'ctech-extension-cache'
          $extRoot = Join-Path $cacheRoot '.wix/extensions/WixToolset.Util.wixext/6.0.0.1'
          New-Item -ItemType Directory -Force -Path $extRoot | Out-Null
          [System.IO.Compression.ZipFile]::ExtractToDirectory($pkg, $extRoot)
          $dll = Join-Path $extRoot 'wixext6/WixToolset.Util.wixext.dll'
          if (-not (Test-Path $dll)) { throw "Util extension DLL not found in package: $dll" }
          "WIX_EXTENSIONS=$cacheRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Test extension cache prepared: $dll"
          Write-Host 'Only runner cache changed; upstream files untouched.'

      - name: Restore exact .NET 6 native host packages required by NetFx
        shell: pwsh
        working-directory: wix-source
        run: |
          $ErrorActionPreference = 'Stop'
          $config = 'src/ext/NetFx/netcoresearch/packages.config'
          if (-not (Test-Path $config)) { throw "Missing upstream NuGet package manifest: $config" }

          # Upstream netfx_t.proj normally performs this restore via WixClean;
          # the incremental extension build skips it. Restore here instead.
          & nuget restore $config -PackagesDirectory 'packages' -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "Native host package restore failed: $LASTEXITCODE" }

          foreach ($arch in @('x86', 'x64', 'arm64')) {
            $base = "packages/runtime.win-$arch.Microsoft.NETCore.DotNetAppHost.6.0.4/runtimes/win-$arch/native"
            $header = Join-Path $base 'hostfxr.h'
            if (-not (Test-Path $header)) {
              Get-ChildItem $base -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
              throw "Expected original .NET 6.0.4 hostfxr.h missing: $header"
            }
            $resolver = "packages/runtime.win-$arch.Microsoft.NETCore.DotNetHostResolver.6.0.4/runtimes/win-$arch/native/hostfxr.dll"
            if (-not (Test-Path $resolver)) { throw "Expected original hostfxr.dll missing: $resolver" }
            Write-Host "Verified original .NET 6.0.4 native hosting files for $arch"
          }

      - name: Build remaining extensions and finish upstream build
        shell: cmd
        working-directory: wix-source
        run: |
          call "%CTECH_VSDEVCMD%" -no_logo -arch=amd64
          if errorlevel 1 exit /b 1
          if not exist "%WIX_EXTENSIONS%\.wix\extensions\WixToolset.Util.wixext\6.0.0.1\wixext6\WixToolset.Util.wixext.dll" exit /b 1
          call src\ext\ext.cmd release inc
          if errorlevel 1 exit /b 1
          call src\setup\setup.cmd release
          if errorlevel 1 exit /b 1
          call src\test\test.cmd release
          if errorlevel 1 exit /b 1
          call src\internal\finalize.cmd release
          exit /b %errorlevel%

      - name: Rebuild eligible C# package projects with Portable PDB and pack matching nupkg/snupkg
        shell: pwsh
        working-directory: wix-source
        run: |
          $ErrorActionPreference = 'Stop'
          $artifacts = Join-Path $PWD 'build/artifacts'
          $scratch = Join-Path $env:RUNNER_TEMP 'ctech-symbol-packages'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null

          # The WiX source contains both SDK-style assemblies and custom .nuspec
          # packages. NuGet raises NU5005 when IncludeSymbols is forced on
          # custom nuspec projects. Build and test the upstream product with
          # its original PDB settings first, then selectively REBUILD eligible
          # C# projects using Portable PDB and re-pack BOTH binary + symbols.
          # Avoid rebuilding downstream .wixproj references with the managed
          # DebugType=portable property: WiX accepts only full/none for wixpdb.
          # Never pair a newly rebuilt PDB with an older nupkg binary.
          $msbuild = $env:CTECH_MSBUILD
          if (-not $msbuild -or -not (Test-Path $msbuild)) { throw "Pinned historical MSBuild not found: $msbuild" }

          $packages = @(Get-ChildItem $artifacts -Filter '*.nupkg' -File)
          if (-not $packages.Count) { throw 'No binary packages to associate symbol packages with' }

          $report = [System.Collections.Generic.List[object]]::new()
          $allCandidates = @(Get-ChildItem 'src' -Recurse -Filter '*.csproj' -File |
            Where-Object {
              $packageFile = Join-Path $artifacts "$($_.BaseName).6.0.0.1.nupkg"
              (Test-Path $packageFile) -and
              -not @(Get-ChildItem $_.DirectoryName -Filter '*.nuspec' -File).Count
            } | Sort-Object FullName -Unique)

          # Only re-pack ordinary SDK assembly packages with Portable PDB.
          # WiX also generates content-only sources, templates, extension packs,
          # custom .nuspec-based SDK/Heat packs, and a separately assembled CLI.
          # Those must retain their original upstream-specific package layout.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $candidates = [System.Collections.Generic.List[object]]::new()
          foreach ($project in $allCandidates) {
            $xmlText = [System.IO.File]::ReadAllText($project.FullName)
            $reason = $null
            if ($project.BaseName.EndsWith('.wixext') -or $xmlText -match 'WixExt[.]props') {
              $reason = 'custom WiX extension package'
            } elseif ($xmlText -match '(?is)<IncludeBuildOutput>\s*false\s*</IncludeBuildOutput>' -or
                      $xmlText -match '(?is)<NoBuild>\s*true\s*</NoBuild>') {
              $reason = 'content-only package (no compiled assembly)'
            } elseif ($xmlText -match '(?is)<NuspecFile>' -or
                      $xmlText -match '(?is)<PackAsTool>\s*true\s*</PackAsTool>') {
              $reason = 'custom NuGet package / published CLI layout'
            }

            # A normal managed .snupkg requires an assembly in the binary
            # package, not merely a csproj with the same package ID.
            if (-not $reason) {
              $packageFile = Join-Path $artifacts "$($project.BaseName).6.0.0.1.nupkg"
              $zip = [System.IO.Compression.ZipFile]::OpenRead($packageFile)
              try {
                $assemblies = @($zip.Entries | Where-Object {
                  $_.FullName -match '^lib/[^/]+/[^/]+[.]dll$'
                })
                if (-not $assemblies.Count) {
                  $reason = 'not a standard lib/ assembly package'
                }
              } finally { $zip.Dispose() }
            }

            if ($reason) {
              Write-Host "Skipping $($project.BaseName): $reason"
              $report.Add([pscustomobject]@{
                Project = $project.FullName
                Status = "skipped: $reason (original nupkg preserved)"
              })
            } else {
              $candidates.Add($project)
            }
          }
          Write-Host "Eligible managed binary projects: $($candidates.Count); excluded special package projects: $($allCandidates.Count - $candidates.Count)."

          foreach ($project in $candidates) {
            $outDir = Join-Path $scratch $project.BaseName
            New-Item -ItemType Directory -Path $outDir -Force | Out-Null
            Write-Host "Rebuilding and packing Portable PDB symbols: $($project.BaseName)"
            & $msbuild $project.FullName '-t:Rebuild;Pack' '-p:Configuration=Release' '-p:NoBuild=false' '-p:BuildProjectReferences=false' '-p:DebugType=portable' '-p:DebugSymbols=true' '-p:IncludeSymbols=true' '-p:SymbolPackageFormat=snupkg' "-p:PackageOutputPath=$outDir" '-nologo' '-v:minimal'
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) { throw "C# rebuild/Pack failed for $($project.FullName) with code $exitCode" }

            $binary = Join-Path $outDir "$($project.BaseName).6.0.0.1.nupkg"
            $symbol = Join-Path $outDir "$($project.BaseName).6.0.0.1.snupkg"
            if (-not (Test-Path $binary)) { throw "Expected rebuilt binary package missing: $binary" }
            if (Test-Path $symbol) {
              Copy-Item -LiteralPath $binary -Destination $artifacts -Force
              Copy-Item -LiteralPath $symbol -Destination $artifacts -Force
              $state = 'created (matched binaries and symbols)'
            } else {
              # Do not overwrite original binaries without a matching symbol package.
              # Resource-only or packaging-only projects might lack Portable PDBs.
              $state = 'no-portable-pdb (original nupkg preserved)'
            }
            $report.Add([pscustomobject]@{ Project=$project.FullName; Status=$state })
          }

          $report | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $artifacts 'ctech-symbols-report.json') -Encoding utf8
          $found = @(Get-ChildItem $artifacts -Filter '*.snupkg' -File)
          if (-not $found.Count) { throw 'No supported SDK-style project produced a .snupkg' }
          Write-Host "Portable symbol packages produced: $($found.Count)"
          $report | Format-Table -AutoSize

      - name: Validate symbol packages contain portable PDBs
        shell: pwsh
        working-directory: wix-source
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $dir = Join-Path $PWD 'build/artifacts'
          $symbols = @(Get-ChildItem $dir -Filter '*.snupkg' -File)
          if (-not $symbols.Count) { throw 'No .snupkg files generated. Symbol build is incomplete.' }
          foreach ($pkg in $symbols) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
            try {
              $nuspec = @($zip.Entries | Where-Object { $_.FullName -match '^[^/]+\.nuspec$' })
              if ($nuspec.Count -ne 1) { throw "Missing nuspec in $($pkg.Name)" }
              $reader = [System.IO.StreamReader]::new($nuspec[0].Open())
              try { [xml]$xml = $reader.ReadToEnd() } finally { $reader.Dispose() }
              $id = [string]$xml.package.metadata.id
              $version = [string]$xml.package.metadata.version
              if ($version -ne '6.0.0.1') { throw "Unexpected $id symbol version $version" }
              if (-not (Test-Path (Join-Path $dir "$id.$version.nupkg"))) { throw "Missing binary counterpart to $($pkg.Name)" }
              $pdbs = @($zip.Entries | Where-Object { $_.Name -match '\.pdb$' })
              if (-not $pdbs.Count) { throw "No PDB files in $($pkg.Name)" }
              foreach ($pdb in $pdbs) {
                $stream = $pdb.Open()
                try {
                  $magic = [byte[]]::new(4)
                  $count = $stream.Read($magic, 0, 4)
                  if ($count -ne 4 -or [System.Text.Encoding]::ASCII.GetString($magic) -ne 'BSJB') {
                    throw "Unsupported Windows PDB instead of Portable PDB: $($pkg.Name)/$($pdb.FullName)"
                  }
                } finally { $stream.Dispose() }
              }
              Write-Host "$($pkg.Name): $($pdbs.Count) portable PDB(s)"
            } finally { $zip.Dispose() }
          }
          Write-Host "Validated $($symbols.Count) .snupkg packages."
          Write-Host 'Portable PDB symbol packages validated.'

      - name: Set CTech self-compiled ReleaseNotes in every NuGet binary package
        shell: pwsh
        working-directory: wix-source
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $notes = 'CTech self-compiled build from WiX Toolset v6.0.0 source (upstream commit 8c7432e50072e009353ea5f2c956ccf453476f71). Not an official WiX binary distribution.'
          $packages = @(Get-ChildItem 'build/artifacts' -Filter '*.nupkg' -File)
          if ($packages.Count -lt 1) { throw 'No self-compiled binary NuGet packages found' }
          foreach ($package in $packages) {
            $zip = [System.IO.Compression.ZipFile]::Open($package.FullName, [System.IO.Compression.ZipArchiveMode]::Update)
            try {
              $nuspec = @($zip.Entries | Where-Object { $_.FullName -match '^[^/]+[.]nuspec$' })
              if ($nuspec.Count -ne 1) { throw "Expected one nuspec in $($package.Name)" }
              $reader = [System.IO.StreamReader]::new($nuspec[0].Open())
              try { [xml]$xml = $reader.ReadToEnd() } finally { $reader.Dispose() }
              $metadata = $xml.SelectSingleNode('/*[local-name()="package"]/*[local-name()="metadata"]')
              if ($null -eq $metadata) { throw "Missing package metadata in $($package.Name)" }
              $node = $metadata.SelectSingleNode('*[local-name()="releaseNotes"]')
              if ($null -eq $node) {
                $node = $xml.CreateElement('releaseNotes', $metadata.NamespaceURI)
                $description = $metadata.SelectSingleNode('*[local-name()="description"]')
                if ($null -ne $description) { [void]$metadata.InsertAfter($node, $description) }
                else { [void]$metadata.AppendChild($node) }
              }
              $node.InnerText = $notes
              $entryName = $nuspec[0].FullName
              $nuspec[0].Delete()
              $newEntry = $zip.CreateEntry($entryName, [System.IO.Compression.CompressionLevel]::Optimal)
              $writer = [System.IO.StreamWriter]::new($newEntry.Open(), [System.Text.UTF8Encoding]::new($false))
              try { $xml.Save($writer) } finally { $writer.Dispose() }
            } finally { $zip.Dispose() }
          }
          Write-Host "Stamped ReleaseNotes in $($packages.Count) self-compiled binary NuGet packages."
      - name: Inspect and verify produced NuGet packages
        shell: pwsh
        working-directory: wix-source
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $dir = Join-Path $PWD 'build/artifacts'
          if (-not (Test-Path $dir)) { throw "Missing build/artifacts" }
          $packages = @(Get-ChildItem $dir -File | Where-Object { $_.Name -match '\.(nupkg|snupkg)$' })
          if (-not $packages.Count) { throw "No NuGet packages produced" }
          $results = foreach ($pkg in $packages) {
            if ($pkg.Extension -eq '.snupkg') {
              [pscustomobject]@{ file=$pkg.Name; packageId=$null; version=$null; sha256=(Get-FileHash $pkg.FullName -Algorithm SHA256).Hash; dependencies=@() }
              continue
            }
            $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
            try {
              $nuspec = @($zip.Entries | Where-Object { $_.FullName -match '^[^/]+\.nuspec$' })
              if ($nuspec.Count -ne 1) { throw "Expected exactly one nuspec in $($pkg.Name)" }
              $reader = [System.IO.StreamReader]::new($nuspec[0].Open())
              try { [xml]$xml = $reader.ReadToEnd() } finally { $reader.Dispose() }
              $meta = $xml.package.metadata
              $id = [string]$meta.id
              $ver = [string]$meta.version
              if ($ver -ne '6.0.0.1') { throw "Unexpected version $id $ver in $($pkg.Name)" }
              $expectedNotes = 'CTech self-compiled build from WiX Toolset v6.0.0 source (upstream commit 8c7432e50072e009353ea5f2c956ccf453476f71). Not an official WiX binary distribution.'
              if ([string]$meta.releaseNotes -ne $expectedNotes) { throw "Missing or unexpected CTech ReleaseNotes in $($pkg.Name)" }
              $deps = @($xml.SelectNodes('//*[local-name()="dependency"]') | ForEach-Object {
                [pscustomobject]@{ id = $_.GetAttribute('id'); version = $_.GetAttribute('version') }
              })
              foreach ($dep in $deps) {
                if ($dep.id -match '^(?i:WixToolset\.|WixInternal\.|wix$)' -and
                    $dep.version -notmatch '6\.0\.0\.1') {
                  throw "Unpatched WiX dependency: $id -> $($dep.id) $($dep.version)"
                }
              }
              [pscustomobject]@{ file=$pkg.Name; packageId=$id; version=$ver; sha256=(Get-FileHash $pkg.FullName -Algorithm SHA256).Hash; dependencies=$deps }
            } finally {
              $zip.Dispose()
            }
          }
          if (-not ($results | Where-Object { $_.packageId -eq 'WixToolset.Sdk' })) {
            throw 'Missing WixToolset.Sdk package'
          }
          if (-not ($results | Where-Object { $_.packageId -eq 'wix' })) {
            throw 'Missing wix CLI package'
          }
          $results | Sort-Object packageId | ConvertTo-Json -Depth 8 | Set-Content -Path "$dir/ctech-manifest.json" -Encoding utf8
          $results | Sort-Object packageId | Format-Table packageId,version,file -AutoSize
          Write-Host "Validated $($packages.Count) NuGet files."

      - name: Verify upstream source changes after build
        shell: pwsh
        working-directory: wix-source
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Upstream diff has whitespace errors' }
          $allowed = @(
            'src/internal/SetBuildNumber/SomeVerInfo.props.pp',
            'src/internal/SetBuildNumber/Directory.Packages.props.pp',
            'src/internal/SetBuildNumber/global.json.pp'
          )
          $changed = @(git diff --name-only | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect upstream source changes' }
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -or $changed.Count -ne 3) {
            throw "Unexpected upstream source changes after build: $($changed -join ', ')"
          }
          Write-Host 'Verified: only the three permitted versioning templates changed.'

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: wix6-ctech-6.0.0.1-packages
          path: |
            wix-source/build/artifacts/*.nupkg
            wix-source/build/artifacts/*.snupkg
            wix-source/build/artifacts/ctech-manifest.json
            wix-source/build/artifacts/ctech-symbols-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload WiX Additional Tools
        uses: actions/upload-artifact@v4
        with:
          name: wix6-ctech-6.0.0.1-additional-tools
          path: wix-source/build/artifacts/WixAdditionalTools.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix6-ctech-6.0.0.1-build-logs
          path: wix-source/build/logs/
          if-no-files-found: warn
          retention-days: 7
